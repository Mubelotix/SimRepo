name: Attach Builds to Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Sync manifest.json version
        working-directory: extension
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          MANIFEST_VERSION=$(jq -r '.version' source/manifest.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Manifest version '$MANIFEST_VERSION' does not match tag version '$VERSION'. Updating."
            jq --arg v "$VERSION" '.version = $v' source/manifest.json > source/manifest.tmp.json
            mv source/manifest.tmp.json source/manifest.json
          fi

      - uses: actions/setup-node@v3
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build Chrome
        working-directory: extension
        run: npm run build:chrome

      - name: Build Firefox
        working-directory: extension
        run: npm run build:firefox

      - name: Build Edge
        working-directory: extension
        run: npm run build:edge

      - name: Upload builds to release
        working-directory: extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            chrome.zip \
            firefox.zip \
            edge.zip \
            --clobber
